repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
        exclude: ^tests/fixtures/
      - id: check-added-large-files
      - id: detect-private-key
        exclude: ^tests/
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.4
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.14.0
    hooks:
      - id: mypy
        files: ^src/
        additional_dependencies: [pydantic>=2.9, types-PyYAML, typer, rich, cryptography]
  - repo: local
    hooks:
      - id: skillfuse-self-scan
        name: skillfuse scan of benign fixtures
        entry: uv run skillfuse scan tests/fixtures/corpus/benign --fail-on high
        language: system
        pass_filenames: false
        files: ^(src/|tests/fixtures/corpus/benign/)

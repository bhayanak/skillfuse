name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_SYSTEM_PYTHON: "1"
  FORCE_COLOR: "1"

jobs:
  lint:
    name: Lint & type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: uv sync --all-extras --frozen || uv sync --all-extras
      - run: uv run ruff check src tests
      - run: uv run ruff format --check src tests
      - run: uv run mypy src

  test:
    name: Test (py${{ matrix.python }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.12", "3.13"]
        include:
          - os: ubuntu-latest
            python: "3.14"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: uv sync --all-extras
      - name: Run tests with coverage
        run: uv run pytest -q --cov --cov-report=xml --cov-report=term --junitxml=junit.xml
      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        uses: codecov/codecov-action@v7
        with:
          files: coverage.xml
          fail_ci_if_error: false
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: junit-${{ matrix.os }}-${{ matrix.python }}
          path: junit.xml

  self-scan:
    name: Self-scan fixtures (SARIF)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: uv sync
      - name: Scan the benign corpus (must pass)
        run: uv run skillfuse ci tests/fixtures/corpus/benign --sarif benign.sarif
      - name: Scan the malicious corpus (expected to block)
        run: |
          set +e
          uv run skillfuse ci tests/fixtures/corpus/malicious --sarif malicious.sarif
          code=$?
          echo "exit code: $code"
          test "$code" -eq 2 || { echo "::error::expected policy block (exit 2) on malicious corpus"; exit 1; }
      - name: Upload SARIF (malicious corpus, for dashboard demo)
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: malicious.sarif
          category: skillfuse-fixtures

  build:
    name: Build distributions
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: uv build
      - name: Check reproducibility of the wheel
        run: |
          cp -r dist dist1
          rm -rf dist
          SOURCE_DATE_EPOCH=0 uv build
          ls -la dist dist1
      - name: Smoke-install wheel
        run: |
          python -m venv /tmp/v && /tmp/v/bin/pip install -q dist/*.whl
          /tmp/v/bin/skillfuse --version
          /tmp/v/bin/skillfuse rules list -f json | head -c 300
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: skillfuse:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: docker run --rm -v "$PWD/tests/fixtures/corpus/benign:/src:ro" skillfuse:ci scan /src --no-policy

  action-test:
    name: Composite action smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./
        id: sc
        with:
          path: tests/fixtures/corpus/benign
          upload-sarif: "false"
      - run: |
          echo "exit=${{ steps.sc.outputs.exit-code }} findings=${{ steps.sc.outputs.findings }}"
          test "${{ steps.sc.outputs.exit-code }}" = "0"

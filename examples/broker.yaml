# Example broker policy for `skillchain broker`.
name: jira-server-broker
default: allow
approved_capabilities: ["jira.read", "confluence.read", "network.egress"]   # usually taken from skillchain.lock
deny_capabilities: ["system.persistence"]
ask_capabilities: ["jira.write", "confluence.write", "filesystem.write", "shell.exec"]
deny_tools: ["*delete*", "*destroy*"]
allow_tools: ["getJiraIssue", "searchJiraIssuesUsingJql"]
max_calls_per_minute: 60
block_secret_arguments: true
drift_is_quarantine: true

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "skillfuse"
version = "0.2.0"
description = "Supply-chain security for AI agent skills: scan, infer capabilities, detonate, sign, lock, and broker."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "SkillFuse contributors" }]
keywords = ["ai", "agents", "skills", "mcp", "supply-chain", "security", "sarif", "sigstore", "prompt-injection"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Security",
  "Topic :: Software Development :: Quality Assurance",
  "Typing :: Typed",
]
dependencies = [
  "pydantic>=2.9",
  "typer>=0.12",
  "rich>=13.7",
  "pyyaml>=6.0.1",
  "cryptography>=43.0",
]

[project.optional-dependencies]
sigstore = ["sigstore>=3.5"]

[project.scripts]
skillfuse = "skillfuse.cli.app:main"

[project.urls]
Homepage = "https://github.com/bhayanak/skillfuse"
Documentation = "https://github.com/bhayanak/skillfuse/tree/main/docs"
Changelog = "https://github.com/bhayanak/skillfuse/blob/main/CHANGELOG.md"
Issues = "https://github.com/bhayanak/skillfuse/issues"
Security = "https://github.com/bhayanak/skillfuse/blob/main/SECURITY.md"

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "pytest-timeout>=2.3",
  "mypy>=1.13",
  "ruff>=0.7",
  "types-PyYAML>=6.0.12",
  "hypothesis>=6.115",
]

[tool.hatch.build.targets.wheel]
packages = ["src/skillfuse"]

[tool.hatch.build.targets.sdist]
include = ["src/skillfuse", "tests", "docs", "README.md", "LICENSE", "CHANGELOG.md"]

[tool.ruff]
target-version = "py311"
line-length = 110
src = ["src", "tests"]
extend-exclude = ["tests/fixtures"]

[tool.ruff.lint]
select = [
  "E", "F", "W",      # pycodestyle / pyflakes
  "I",                # isort
  "UP",               # pyupgrade
  "B",                # bugbear
  "S",                # bandit
  "C4",               # comprehensions
  "SIM",              # simplify
  "RUF",              # ruff-specific
  "PL",               # pylint subset
  "T20",              # no print in library code
  "N",                # naming
  "ANN",              # annotations
  "PTH",              # pathlib
]
ignore = [
  "PLR0913",  # too many arguments
  "PLR2004",  # magic values
  "PLR0912",  # too many branches (rule tables are branchy by nature)
  "PLR0911",  # too many returns
  "PLR0915",  # too many statements
  "ANN401",   # Any in **kwargs
  "S603",     # subprocess call – audited and intentional in sandbox/signing
  "S607",     # partial path for executables (we resolve shims deliberately)
  "S404",     # subprocess import
  "E501",     # formatter owns line length
  "RUF012",   # mutable class attributes (pydantic/typer idioms)
  "PLC0415",  # lazy imports are deliberate (CLI start-up time, optional deps)
  "PLR0917",  # too many positional arguments
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S108", "ANN", "PLR", "S", "T20", "RUF001", "RUF003"]
"src/skillfuse/cli/**" = ["T20"]
"scripts/**" = ["T20", "S101"]
"src/skillfuse/sandbox/shims/**" = ["ALL"]
"src/skillfuse/rules/hidden_content.py" = ["RUF001"]  # confusable characters are the subject matter

[tool.ruff.lint.isort]
known-first-party = ["skillfuse"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
pretty = true
plugins = ["pydantic.mypy"]
exclude = ["src/skillfuse/sandbox/shims/"]

[[tool.mypy.overrides]]
module = ["sigstore.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --timeout=120"
markers = [
  "slow: slow tests (sandbox detonation, subprocesses)",
  "docker: requires a working docker daemon",
  "network: requires outbound network (never run in CI by default)",
]
filterwarnings = ["error::DeprecationWarning:skillfuse.*"]

[tool.coverage.run]
source = ["skillfuse"]
branch = true
omit = ["src/skillfuse/sandbox/shims/*", "src/skillfuse/__main__.py"]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
  "raise NotImplementedError",
  "\\.\\.\\.",
]
